# ─────────────────────────────────────────────────────────────────
#  Монітор замовлень на Freelancehunt
#  Скопіюйте цей файл у config.yaml. Програмувати нічого не треба.
# ─────────────────────────────────────────────────────────────────

# ── Що ви продаєте ───────────────────────────────────────────────
# За цим текстом складається чернетка відгуку. Пишіть конкретно:
# назви пакетів, ціни, терміни. Що детальніше — то точніша чернетка.
my_offer: |
  Я прибираю повторювану ручну роботу, на яку в компанії щотижня йдуть
  години. Спочатку розбираємось, скільки саме часу з'їдає процес і чи варто
  його взагалі автоматизувати, — і тільки потім я щось будую.

  ДВІ ГОТОВІ СИСТЕМИ (швидко, фіксована ціна):

  1) РОЗБІР ЗУСТРІЧЕЙ. Керівник більше не нагадує людям, що вони обіцяли.
     Транскрипція зустрічі → задачі в Notion із відповідальним, дедлайном і
     дослівною цитатою з розмови → кожному свої задачі в Telegram із кнопками
     «Готово / Відкласти / Не актуально» → тижневий звіт «що обіцяли проти
     того, що зробили».
     Пакети (PL): Start 1 900 zł netto (2 дні), Team 4 500 zł (4 дні),
     Pro 8 900 zł (7 днів). Опіка від 900 zł/міс.
     Пакети (UA): 6 000 / 15 000 / 30 000 ₴.

  2) ТРІАЖ ВХІДНОЇ ПОШТИ. Власник перестає витрачати півтори години щодня на
     розбір скриньки. Читає Gmail, витягує текст із PDF і сторінок за
     посиланнями, сортує листи на важливі / неважливі / потребують уваги,
     пише резюме з дедлайнами в Google Таблицю. Нічого не видаляє й не
     відповідає — тільки читає й сортує.
     Пакети (PL): Start 1 900 zł netto (3 дні), Business 4 500 zł (6 днів),
     Pro 7 900 zł (10 днів). Опіка від 500 zł/міс.
     Пакети (UA): 9 000 / 18 000 / 30 000 ₴.

  ПІД ЗАДАЧУ. Будь-яка повторювана робота, у якої є зрозуміле правило:
  зведення файлів від постачальників, перенесення даних із пошти в таблицю,
  витяг сум із рахунків і накладних у PDF, звірка двох списків, підготовка
  однотипних звітів. Ціну називаю після короткої розмови про процес —
  за обсягом це зазвичай те саме, що й пакети вище (1 900 – 8 900 zł).

  Працюю з Notion, Telegram, Gmail, Google Sheets, власним кодом на Python.
  Обидві системи написав сам, тому будь-яку зміну роблю у себе, не чекаючи
  на постачальника.

  ВАЖЛИВО: я автоматизую процес, а не виконую його руками. Якщо замовнику
  потрібна людина, яка щодня сама вбиватиме дані в таблицю, — це не до мене,
  і про це треба сказати одразу.

  ЧОГО НЕ РОБЛЮ: дизайн, тексти, SEO, верстку сайтів, мобільні застосунки,
  ручне введення даних як послугу.

# ── Наскільки прискіпливо фільтрувати ────────────────────────────
# Мінімальна сума балів, щоб замовлення взагалі показали.
# Менше значення = більше замовлень і більше шуму.
min_score: 6

# Чернетка відгуку складається лише для замовлень від цього порога —
# щоб не витрачати гроші на ШІ там, де збіг слабкий.
draft_min_score: 10

# Пропускати замовлення, де вже забагато відгуків: ви все одно запізнились.
max_bids: 25

# Мінімальний бюджет. Замовлення без вказаного бюджету не відсіюються.
min_budget:
  UAH: 3000
  USD: 80
  EUR: 80

# Пропускати замовлення тільки для Plus-акаунтів, якщо у вас його немає.
skip_plus_only: true

# Скільки сторінок стрічки переглядати за раз (по ~10 замовлень).
pages: 2

# Мова відповідей API та чернеток: uk, ru або en.
language: "uk"

# ── Сповіщення в Telegram ────────────────────────────────────────
# Як отримати chat_id — у README.
notify_telegram: false
telegram_chat_id: ""

# ── Куди складати ────────────────────────────────────────────────
csv_path: "data/leads.csv"

# ── Чернетки відгуків ────────────────────────────────────────────
draft_replies: true
model: "claude-opus-5"
effort: "medium"

# ── Тонке налаштування пошуку (можна не чіпати) ──────────────────
# Кожна група — набір слів і її вага. Збіг у групі додає вагу,
# кожне наступне слово в тій самій групі додає ще по балу.
# stop_words віднімають по 4 бали — так відсіюється дизайн і копірайтинг.
#
# Група "process" ловить тих, хто ще не знає слова «автоматизація»: людина
# пише «щодня зводимо Excel від пʼяти постачальників», а не «потрібен n8n».
# Конкурентів там помітно менше, але й слова загальніші, тому одного збігу
# для проходження не досить — потрібні щонайменше два.
