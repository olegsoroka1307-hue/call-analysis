# ─────────────────────────────────────────────────────────────────────
#  Налаштування системи тріажу пошти
#  Це єдиний файл, який ви редагуєте. Програмувати нічого не треба.
#  Скопіюйте його у config.yaml і заповніть.
# ─────────────────────────────────────────────────────────────────────

# ГОЛОВНЕ ПОЛЕ. Опишіть своїми словами, чим ви займаєтесь і що для вас
# важливо. Саме за цим текстом система вирішує долю кожного листа.
# Чим конкретніше — тим менше помилок. Пишіть як живій людині.
business_context: |
  Ми — маркетингова агенція на 8 людей. Працюємо з малим бізнесом.

  ВАЖЛИВО для мене:
  - листи від чинних клієнтів: питання, скарги, зміни в проєктах
  - усе про гроші: рахунки, оплати, прострочення, акти
  - запити на нову співпрацю від реальних компаній
  - дедлайни, зриви термінів, юридичні питання, податкова
  - листи від підрядників, якщо вони блокують нашу роботу

  НЕ ВАЖЛИВО:
  - розсилки, вебінари, новини сервісів
  - автоматичні сповіщення систем (крім помилок оплати)
  - холодні пропозиції послуг, які ми не замовляли
  - соцмережі, сповіщення про лайки й підписки

  ОБЕРЕЖНО (краще покажіть мені):
  - будь-що зі зміною банківських реквізитів
  - листи «від керівництва» з терміновою вимогою оплати
  - незнайомі відправники, що просять дані або доступи

# Які листи брати. Синтаксис такий самий, як у рядку пошуку Gmail.
#   is:unread newer_than:7d     — непрочитані за тиждень
#   in:inbox newer_than:1d      — усе вхідне за добу
gmail_query: "is:unread newer_than:7d"

# Скільки листів обробляти за один запуск.
max_emails_per_run: 25

# Мова, якою писати резюме у звіті.
output_language: "українська"

# ── Куди складати результат ─────────────────────────────────────────
# csv    — файл на компʼютері. Працює одразу, без доступів до Google.
# sheets — Google Таблиця (потрібен доступ, див. README).
output: "csv"
csv_path: "data/results.csv"

# Заповніть, якщо output: sheets. ID береться з адреси таблиці —
# це довгий набір символів між /d/ та /edit.
spreadsheet_id: ""
sheet_name: "Тріаж"

# ── Наскільки система обережна ──────────────────────────────────────
# Якщо впевненість нижча за цей поріг — лист іде на ваш перегляд.
# Більше значення = більше листів вам, але менше пропущеного важливого.
confidence_threshold: 0.75

# ── Що читати додатково ─────────────────────────────────────────────
read_pdfs: true            # витягати текст із PDF-вкладень
max_pdf_pages: 30

fetch_links: true          # відкривати посилання з листа
max_links_per_email: 3
link_timeout_seconds: 10

# ── Економія на розсилках ───────────────────────────────────────────
# true — листи з ознакою масової розсилки (заголовок List-Unsubscribe)
# і без вкладень позначаються NOT_IMPORTANT без звернення до ШІ.
# Це найбільша економія на великому потоці, але це автоматичне рішення
# без участі моделі — вмикайте свідомо.
skip_bulk_mail: false

# Відправники, яких ніколи не відсівати, навіть якщо лист схожий на розсилку.
# Достатньо частини адреси або домену.
never_skip_senders:
  - "bigclient.ua"
  - "buh@"

# ── Модель ──────────────────────────────────────────────────────────
model: "claude-opus-5"
# Скільки моделі «думати»: low, medium, high, xhigh, max.
# medium — розумний баланс для пошти. Ставте high, якщо листи складні.
effort: "medium"

# ── Безпека ─────────────────────────────────────────────────────────
# Змінити на false не можна: система вміє лише читати.
safe_mode: true
