# ТЗ §47 — локальний запуск усього стеку однією командою.
#
# Обсяг: цей compose піднімає backend + postgres. Redis, scheduler, фронтенд
# і Telegram-воркер з ТЗ §47 сюди НЕ входять — вони належать пізнішим
# спринтам (§27, §29, §30-§34) і зараз їх просто нема чого запускати.
# Тому §47 закритий частково, і в README це сказано прямо.
#
# Smoke test з чистого volume:
#     docker compose down -v && docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betting_poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betting_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/betting_poc
      ODDS_PROVIDER: ${ODDS_PROVIDER:-replay}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      REPLAY_DATA_DIR: data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: >
      sh -c "alembic upgrade head &&
             python -m app.tools.make_replay_dataset --days-ahead 3 &&
             python -m app.tools.run_poc &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
