# ─────────────────────────────────────────────────────────────────────
#  Налаштування розбору нарад
#  Скопіюйте у config.yaml і заповніть. Секрети — в .env, не сюди.
# ─────────────────────────────────────────────────────────────────────

# Хто у вас у команді й хто за що відповідає. За цим система розуміє, кому
# призначати задачу, коли на нараді кажуть просто «Саша». Пишіть своїми
# словами, як живій людині.
team_context: |
  Ми — будівельна компанія. Наради щотижневі, обговорюємо об'єкти,
  підрядників і терміни.
  Саша — продажі й комерційні пропозиції.
  Марія — фінанси, акти, рахунки.
  Петро — сайт і реклама.
  Задача — це конкретний результат із людиною і датою, а не «треба подумати».

# ── Notion ───────────────────────────────────────────────────────────
# ID бази «Домовленості». Береться з посилання на базу:
# notion.com/p/7d37ee3add0346f1b6df3bb1c2efebce -> ось цей хвіст.
notion_database_id: "ЗАПОВНІТЬ"

# ── Telegram ─────────────────────────────────────────────────────────
# Токен бота лежить у .env як TELEGRAM_BOT_TOKEN, а не тут.
send_telegram: true

# Скільки задач максимум узяти з однієї наради. Захист від того, що модель
# нафантазує сто пунктів із півгодинної розмови.
max_commitments: 30

# ── Модель ───────────────────────────────────────────────────────────
model: "claude-opus-5"
effort: "medium"
output_language: "українська"
max_transcript_chars: 60000

# Пріоритет за замовчуванням: Високий, Середній або Низький.
default_priority: "Середній"

# ── Файли ────────────────────────────────────────────────────────────
# Реєстр співробітників і памʼять про вже розібрані наради.
registry_db: "data/registry.db"
error_log: "data/errors.jsonl"

# Куди складати документи, зроблені командою document.
documents_dir: "outputs"
