# ─────────────────────────────────────────────────────────────────────
#  Наради → задачі
#  Це єдиний файл, який ви редагуєте. Секрети сюди не пишуть — вони в .env
#  Скопіюйте його у config.yaml і заповніть.
# ─────────────────────────────────────────────────────────────────────

# ГОЛОВНЕ ПОЛЕ. Хто у вас у команді й хто за що відповідає. За цим текстом
# система розуміє, кому саме призначити задачу, коли на нараді сказали
# «Саша зробить» або «маркетинг підготує». Пишіть як живій людині.
team_context: |
  Ми — агенція на 8 людей.

  Команда:
  - Саша Петренко — продажі, комерційні пропозиції, перемовини з клієнтами
  - Марія Коваль — фінанси, рахунки, акти, звітність
  - Петро Лисенко — сайти й технічна частина
  - Коля Гриценко — реклама, звіти по кампаніях
  - Я (Олег) — усе інше й рішення

  Клієнти, які часто звучать на нарадах: Альфа, Дніпро-Буд, Vitex.

  Якщо на нараді кажуть просто «маркетинг» — це Коля.
  Якщо «бухгалтерія» — це Марія.

# ── Notion ──────────────────────────────────────────────────────────
# ID бази «Домовленості». Береться з адреси бази — це довгий набір
# символів після назви робочого простору й перед знаком ?.
# Немає бази? Створіть командою:  python run.py setup <id_сторінки>
notion_database_id: ""

# ── Telegram ────────────────────────────────────────────────────────
# false — задачі створюються в Notion, але нікому не розсилаються.
send_telegram: true

# ── Модель ──────────────────────────────────────────────────────────
model: "claude-opus-5"
# Скільки моделі «думати»: low, medium, high, xhigh, max.
# high — розумний баланс для нарад: пропущена домовленість коштує дорожче,
# ніж зайві кілька центів на розбір.
effort: "high"

# Мова, якою писати формулювання задач.
output_language: "українська"

# Скільки символів транскрипції брати. Приблизно 120 000 — це три години
# розмови. Довше — обріжеться, і про це буде сказано в підсумку.
max_transcript_chars: 120000
max_output_tokens: 16000

# ── Дрібниці ────────────────────────────────────────────────────────
# Пріоритет для задач, у яких його не видно з розмови.
default_priority: "Средний"

registry_db: "data/registry.db"
error_log: "data/errors.jsonl"
request_timeout_seconds: 30

# Змінити на false не можна: система вміє створювати задачі й міняти їм
# статус, але не вміє нічого видаляти.
safe_mode: true
