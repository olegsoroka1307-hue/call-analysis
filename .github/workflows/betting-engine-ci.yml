# CI для betting-engine (аудит, п.10).
#
# Ключове: інтеграційні тести йдуть у СПРАВЖНІЙ PostgreSQL 16, а не в
# SQLite і не в моках. Причина конкретна — append-only гарантія (ТЗ §7.2)
# тримається тригером PostgreSQL, а JSONB, композитні унікальні ключі та
# TRUNCATE ... RESTART IDENTITY поводяться інакше в інших СУБД. Тест на
# підміненій базі перевіряв би не той код, що поїде в прод.
#
# `--strict-markers -p no:randomly` не потрібні: конфіг у backend/pytest.ini.
# Skips вважаються провалом: прогін має бути 0 skipped (вимога аудиту).
name: betting-engine CI

on:
  push:
    paths:
      - 'betting-engine/**'
      - '.github/workflows/betting-engine-ci.yml'
  pull_request:
    paths:
      - 'betting-engine/**'
      - '.github/workflows/betting-engine-ci.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betting_poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/betting_poc_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/betting_poc_test
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: betting-engine/backend/requirements.lock

      - name: Встановити залежності (точні версії з lock)
        working-directory: betting-engine/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Міграції
        working-directory: betting-engine/backend
        run: alembic upgrade head

      - name: Тести — 0 skipped обовʼязково
        working-directory: betting-engine/backend
        run: |
          pytest -q -rs --tb=short | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::є пропущені тести — інтеграційні мали піти в PostgreSQL"
            exit 1
          fi

      - name: Gate 0 preflight (без ключів — лише мережа)
        working-directory: betting-engine
        continue-on-error: true
        run: python gate0/validate_providers.py --preflight-only

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose з чистого volume
        working-directory: betting-engine
        run: |
          docker compose down -v || true
          docker compose up --build -d
          echo "чекаємо, поки backend стане healthy..."
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q backend)" 2>/dev/null || echo starting)
            echo "  [$i] backend: $status"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker compose logs; exit 1; }
            sleep 5
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/poc/report" > /dev/null
          docker compose logs backend | tail -40

      - name: Прибрати
        if: always()
        working-directory: betting-engine
        run: docker compose down -v
